<!DOCTYPE html>
<html>
    <head>
        <title>Code Kata Ajax</title>
    </head>
    <body>
        <center>
            <!-- Botón que el script detecta mediante document.querySelector(".request") para escuchar los clics -->
            <button type="button" class="request">Generate new one</button>
            
            <!-- Contenedor vacío con la clase ".activity" donde el script inyectará dinámicamente los datos de la API -->
            <div class="activity"></div>
        </center>
        
        <!-- Enlace al archivo de JavaScript (codekata 9.js) que contiene la lógica AJAX y la manipulación del DOM -->
        <script src="codekata 9.js"></script>
    </body>
</html>
